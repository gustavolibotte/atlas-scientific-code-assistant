[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-scientific-code-assistant"
version = "0.1.0"
description = "Evidence-first scientific software engineering assistant (foundation release)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "cryptography>=46.0.7,<49",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "hypothesis>=6.100,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asca = [
    "contracts/exports/v1/*.json",
    "contracts/exports/released.json",
    "infrastructure/persistence/migrations/script.py.mako",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
addopts = "--strict-markers --strict-config"
markers = ["unit: fast isolated unit tests", "contract: boundary and API contract tests", "architecture: dependency direction checks", "security: security-sensitive behavior tests"]

[tool.coverage.run]
branch = true
source = ["asca"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:" ]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["asca"]
warn_unused_configs = true

[tool.uv]
package = true
